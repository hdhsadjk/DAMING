<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff9e9">
  <title>大茗本位製茶堂｜自製活動展示頁</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; color: #39332b;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(ellipse at 15% 12%, #fff 0%, transparent 35%),
        radial-gradient(ellipse at 90% 35%, #fff0bc 0%, transparent 38%),
        linear-gradient(180deg, #fffdf7, #f8e7c6 55%, #fffaf0);
    }
    .header {
      padding: 18px 16px; text-align: center;
      background: rgba(255,255,255,.9);
      border-bottom: 1px solid #eee5d4;
      font-weight: 800; letter-spacing: 2px;
    }
    .container { width: min(100% - 28px, 680px); margin: 24px auto 40px; }
    .intro { text-align: center; padding: 26px 0 20px; }
    .tag {
      display: inline-block; padding: 7px 14px; border-radius: 30px;
      background: #fff; color: #92703b; font-size: 12px; letter-spacing: 1px;
    }
    h1 { font-size: clamp(25px, 6vw, 36px); margin: 16px 0 10px; }
    .subtitle { color: #766653; line-height: 1.8; font-size: 14px; }
    .cloud-card {
      overflow: hidden; padding: 12px; margin: 20px 0;
      border: 1px solid rgba(255,255,255,.9); border-radius: 28px;
      background: rgba(255,255,255,.8);
      box-shadow: 0 12px 32px rgba(125,92,43,.10);
    }
    .image-link { display: block; color: inherit; text-decoration: none; }
    .promo-image { display: block; width: 100%; height: auto; border-radius: 19px; }
    .claim-button {
      display: block; width: 100%; margin: 20px auto; padding: 17px 20px;
      border-radius: 50px; background: #ffdf00; color: #292313;
      text-align: center; font-size: 19px; font-weight: 800;
      text-decoration: none; box-shadow: 0 6px 16px rgba(170,135,0,.18);
    }
    .claim-button:active { transform: scale(.98); }
    h2 { margin: 26px 0 12px; font-size: 20px; text-align: center; }
    .notice {
      margin: 24px 0 0; padding: 15px; border-radius: 16px;
      background: rgba(255,255,255,.7); color: #7d705e;
      font-size: 12px; line-height: 1.8; text-align: center;
    }
    footer { padding: 8px 0 25px; text-align: center; color: #9a8b77; font-size: 11px; }
  </style>
</head>
<body>
  <header class="header">大茗本位製茶堂・飲品展示</header>
  <main class="container">
    <section class="intro">
      <span class="tag">TEA TIME · GOOD MOMENT</span>
      <h1>品味一杯好茶</h1>
      <div class="subtitle">以柔和雲朵色調呈現飲品與菜單<br>點擊下方按鈕前往 官方 活動領取</div>
    </section>
    <section class="cloud-card">
      <a class="image-link" href="https://lin.ee/Xj67HQ6" target="_blank" rel="noopener noreferrer" aria-label="前往 官方 活動頁面">
        <img class="promo-image" src="image1.jpg" alt="大茗本位製茶堂活動頁面">
      </a>
      <a class="claim-button" href="https://lin.ee/Xj67HQ6" target="_blank" rel="noopener noreferrer">領取優惠 →</a>
    </section>
    <h2>一杯好茶，剛剛好的日常</h2>
    <section class="cloud-card">
      <a class="image-link" href="https://lin.ee/Xj67HQ6" target="_blank" rel="noopener noreferrer">
        <img class="promo-image" src="image2.jpg" alt="大茗本位製茶堂飲品展示">
      </a>
    </section>
    <h2>飲品菜單</h2>
    <section class="cloud-card">
      <a class="image-link" href="https://lin.ee/Xj67HQ6" target="_blank" rel="noopener noreferrer">
        <img class="promo-image" src="image3.jpg" alt="大茗本位製茶堂飲品菜單">
      </a>
    </section>
  </main>
  <footer>自製飲品展示頁</footer>
</body>
</html>
